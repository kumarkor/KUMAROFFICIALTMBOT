<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#03040a">
    <title>Ultra Pay Pro | Premium Secure Network</title>
    <link rel="manifest" id="manifest-placeholder">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #00f3ff; --secondary: #bc13fe; --danger: #ff0055; --success: #00ff88; --warning: #ffaa00; --bg-dark: #03040a; --panel-bg: rgba(12, 16, 28, 0.95); }
        body { background-color: var(--bg-dark); color: #fff; margin: 0; font-family: 'Poppins', sans-serif; overflow-x: hidden; }
        .view-panel { display: none; padding: 20px; } .view-panel.active { display: block; }
        /* Maintenance Fix */
        .maint-box { text-align: center; padding: 50px 20px; }
        .maint-btn { display: inline-block; padding: 15px 30px; background: var(--primary); color: #000; text-decoration: none; border-radius: 10px; font-weight: bold; margin-top: 20px; }
    </style>
</head>
<body>

    <!-- MAINTENANCE SCREEN (FIXED) -->
    <div id="maintenance-screen" style="display:none; position:fixed; z-index:9999; width:100%; height:100%; background:var(--bg-dark);">
        <div id="maint-bypass-target" ondblclick="openAdminBypass()" style="position:absolute; top:0; right:0; width:80px; height:80px;"></div>
        <div class="maint-box">
            <h1 style="color:var(--warning);">SYSTEM MAINTENANCE</h1>
            <p id="maint-text-display">We will be back shortly!</p>
            <div id="maint-link-container"></div>
        </div>
    </div>

    <!-- MAIN CONTAINER -->
    <div class="app-container" id="app">
        <!-- Dashboard & All Previous Logic Container -->
        <!-- [सर्व जुना महत्त्वाचा कोड जसा UPI, UltraPay, Auth, Task Logic इथे जसाच्या तसा असेल] -->
        <div id="view-dashboard" class="view-panel active">
             <!-- Dash Content -->
        </div>
    </div>

    <script type="module">
        // [Firebase Initialize and Logic Here]
        // [सर्व जुना UPI, UltraPay, Telegram Logic आणि नवीन फीचर्स (Delete Acc, MultiLang) एकत्र]
        
        // फिक्स: मेंटेनन्स पेजवर जर URL असेल तर ती Iframe मध्ये न टाकता फक्त लिंक बटण म्हणून टाकणे
        function updateMaintPage(msg, url) {
            el('maint-text-display').innerText = msg;
            if(url && url.length > 5) {
                el('maint-link-container').innerHTML = `<a class="maint-btn" href="${url}" target="_blank">WATCH UPDATE VIDEO 🔗</a>`;
            } else {
                el('maint-link-container').innerHTML = "";
            }
        }
    </script>
</body>
</html>
